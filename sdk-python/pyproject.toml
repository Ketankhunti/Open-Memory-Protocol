[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmem"
version = "0.5.0"
description = "Open Memory Protocol (OMP) — one API for any AI memory provider."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OMP Working Group" }]
keywords = ["ai", "memory", "llm", "protocol", "vector", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2",
    "httpx",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.2",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
mem0 = ["mem0ai>=2.0,<3"]
supermemory = []
letta = ["letta-client>=1.10"]
async = ["asyncpg>=0.29", "httpx>=0.27"]
server = ["openmem[async]", "fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "pytest-timeout>=2.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4",
    "openapi-spec-validator>=0.7",
    "PyYAML>=6",
]

[project.scripts]
omp-validate-spec = "openmem._scripts:validate_spec"
openmem-eval = "openmem.eval.cli:main"
omp-server = "openmem.server.cli:main"

[project.urls]
Homepage = "https://github.com/openmem/omp"
Specification = "https://github.com/openmem/omp/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["openmem"]

[tool.hatch.build.targets.wheel.force-include]
"openmem/eval/datasets" = "openmem/eval/datasets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=openmem --cov-report=term-missing --cov-fail-under=85"
timeout = 30
asyncio_mode = "auto"
markers = [
    "live: tests that hit real provider APIs (auto-skipped unless OMP_LIVE=1; budget up to 90s)",
    "slow: tests that take >30s (e.g. spin up a throwaway venv); may be deselected on fast CI runs",
]
