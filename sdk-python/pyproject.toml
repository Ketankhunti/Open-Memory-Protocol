[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openmem"
version = "0.1.0"
description = "Open Memory Protocol (OMP) — one API for any AI memory provider."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OMP Working Group" }]
keywords = ["ai", "memory", "llm", "protocol", "vector", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2",
    "httpx",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "python-ulid>=2.2",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "testcontainers[postgres]>=4",
    "openapi-spec-validator>=0.7",
    "PyYAML>=6",
]

[project.scripts]
omp-validate-spec = "openmem._scripts:validate_spec"

[project.urls]
Homepage = "https://github.com/openmem/omp"
Specification = "https://github.com/openmem/omp/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["openmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=openmem --cov-report=term-missing --cov-fail-under=85"
