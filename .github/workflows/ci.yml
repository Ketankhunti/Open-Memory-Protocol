name: ci

on:
  push:
    branches: [main, "001-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./sdk-python[dev,async]"
      - name: Validate OpenAPI spec (Principle I)
        run: omp-validate-spec
      - name: Run conformance suite (overall ≥85%)
        run: pytest sdk-python/tests -q
      - name: Postgres adapter coverage (≥90%)
        run: |
          pytest sdk-python/tests \
            -o addopts="" \
            --cov=openmem.adapters.postgres \
            --cov-report=term-missing \
            --cov-fail-under=90
